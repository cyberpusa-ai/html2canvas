<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>box-shadow with border-radius</title>
    <script type="text/javascript" src="../../test.js"></script>
    <style>
        div {
            display: inline-block;
            width: 90px;
            height: 60px;
            margin: 24px;
            background: white;
            border-radius: 20px;
            font: 10px sans-serif;
        }

        body {
            max-width: 800px;
        }
    </style>
</head>
<body>
<div style="box-shadow: 0 0 0 10px red;">0 0 0 10px</div>
<div style="box-shadow: 10px 10px 0 0 red;">10px 10px</div>
<div style="box-shadow: 10px 10px 0 -5px red;">10px 10px 0 -5px</div>
<div style="box-shadow: 0 0 8px 4px blue;">0 0 8px 4px</div>
<div style="box-shadow: 0 0 0 30px orange; border-radius: 5px;">small radius, 30px spread</div>
<div style="box-shadow: 0 0 0 10px red; border-radius: 0 30px;">mixed corners</div>
<div style="box-shadow: 0 0 0 8px red; border-radius: 50%;">50%</div>
<div style="box-shadow: 6px 6px 0 4px green; border: 4px solid black;">border</div>
<div style="box-shadow: inset 0 0 0 10px red;">inset 0 0 0 10px</div>
<div style="box-shadow: inset 10px 10px 0 0 red;">inset 10px 10px</div>
<div style="box-shadow: inset 0 0 8px 6px blue;">inset 0 0 8px 6px</div>
<div style="box-shadow: inset 0 0 0 30px orange; border-radius: 5px;">inset, larger than the box</div>
<div style="box-shadow: inset 6px 6px 0 4px green; border: 4px solid black;">inset, border</div>
<div style="box-shadow: 0 0 0 8px red, inset 0 0 0 8px blue; border-radius: 50%;">outer and inset</div>
</body>
</html>
