<!DOCTYPE html>
<html dir="rtl" lang="fa-IR">
<head>
    <title>Persian rtl punctuation</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script type="text/javascript" src="../../../test.js"></script>
    <style>
        body{
            font-family: Arial;
            font-size: 20px;
        }
        .test{
            padding: 10px 25px;
            direction: rtl;
        }
        .shadow{
            text-shadow: 2px 2px red;
        }
        .stroke{
            -webkit-text-stroke: 1px blue;
        }
    </style>
</head>
<body>
<p class="test" lang="fa">سلام دنیا! این یک تست است...</p>
<p class="test" lang="fa">«سلام» (دنیا) ؟چرا</p>
<p class="test shadow" lang="fa">سلام دنیا!</p>
<p class="test stroke" lang="fa">!سلام دنیا.</p>
</body>
</html>
